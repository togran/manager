services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: tetref-manager-web
    env_file:
    - .env
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - data:/app/data
    restart: unless-stopped

volumes:
  data:
